<!DOCTYPE html>
<html lang="en">


<head>
 <meta charset="UTF-8">
<!-- ESSENTIAL for responsive design: tells phones to use the real screen width -->
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>Week 1 – Bootstrap Setup</title>
<!-- 1. Bootstrap CSS first -->
 <link rel="stylesheet" href="css/bootstrap.min.css">
<!-- 2. YOUR styles last, so your rules override Bootstrap's -->
 <link rel="stylesheet" href="css/style.css">
</head>


<body>
<!-- Page content goes here (see Part 4) -->

<!-- Navbar: tests Bootstrap JS (the menu collapses on small screens) -->
    <nav class="navbar navbar-expand-md bg-dark" data-bs-theme="dark">
        <div class="container">
            <a class="navbar-brand" href="#">My Site</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#mainNav" aria-controls="mainNav"
            aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <!-- Grid: tests Bootstrap CSS (3 columns on desktop, stacked on mobile) -->
    <main class="container py-5">
        <h1>Bootstrap is working!</h1>
        <div class="row mt-4">
            <div class="col-md-4 p-3 border">Column 1</div>
            <div class="col-md-4 p-3 border">Column 2</div>
            <div class="col-md-4 p-3 border">Column 3</div>
        </div>
        <button class="btn btn-primary mt-4">A Bootstrap button</button>
    </main>

<!-- 3. Bootstrap JS at the END of body, so the page content loads first -->
 <script src="js/bootstrap.bundle.min.js"></script>
<!-- 4. YOUR JavaScript after Bootstrap's -->
 <script src="js/script.js"></script>
</body>


</html>
